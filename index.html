<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depurando . . .</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ========================================================
       VARIABLES: PALETA MODO CLARO MINIMALISTA (BLANCOS Y GRISES)
       ======================================================== */
    :root {
      --bg: #f6f7fa;
      --surface-glass: rgba(255, 255, 255, 0.72);
      --surface-border: rgba(255, 255, 255, 0.95);
      --surface-subtle-stroke: rgba(0, 0, 0, 0.05);

      --charcoal-900: #0e0e11;
      --charcoal-800: #1c1c21;
      --charcoal-700: #2d2d34;
      --silver-500: #71717a;
      --silver-400: #a1a1aa;
      --silver-300: #d4d4d8;
      --silver-100: #f4f4f6;

      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f6f7fa;
      background-color: var(--bg);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Inter', Arial, sans-serif;
      font-family: var(--font-sans);
      color: #0e0e11;
      color: var(--charcoal-900);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fondo: Gradiente radial limpio y microcuadrícula sutil */
    .bg-gradient {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: radial-gradient(circle at 50% 50%, #ffffff 0%, #f4f5f8 55%, #eaecf1 100%);
      z-index: 1;
      pointer-events: none;
    }

    .bg-noise-grid {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background-image: 
        radial-gradient(circle at center, rgba(0, 0, 0, 0.035) 1.5px, transparent 1.5px);
      background-size: 38px 38px;
      z-index: 2;
      pointer-events: none;
      opacity: 0.65;
    }

    /* Foco interactivo suave de luz translúcida */
    #cursor-spotlight {
      position: absolute;
      top: 0;
      left: 0;
      width: 60vw;
      height: 60vw;
      width: clamp(600px, 60vw, 1100px);
      height: clamp(600px, 60vw, 1100px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.3) 40%, transparent 70%);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 3;
      transition: opacity 0.4s ease;
      opacity: 0;
    }

    /* Lienzo interactivo de micropartículas */
    #particle-canvas {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: auto;
    }

    /* ========================================================
       ESCENARIO CENTRAL ESCALADO PARA GRAN FORMATO / TV
       ======================================================== */
    .stage {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      width: 100%;
      max-width: 1600px;
    }

    /* Halo luminoso orgánico blanco suave */
    .central-glow {
      position: absolute;
      width: 65vw;
      height: 65vw;
      max-width: 1050px;
      max-height: 1050px;
      width: clamp(550px, 65vw, 1050px);
      height: clamp(550px, 65vw, 1050px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(230, 235, 245, 0.5) 45%, transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    @keyframes breatheGlow {
      0% {
        transform: scale(0.9);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.9;
      }
      100% {
        transform: scale(0.95);
        opacity: 0.65;
      }
    }

    /* Anillos hairline monocromáticos en tonos grafito tenue */
    .rings-container {
      position: absolute;
      width: 75vw;
      height: 75vw;
      max-width: 1150px;
      max-height: 1150px;
      width: clamp(560px, 75vw, 1150px);
      height: clamp(560px, 75vw, 1150px);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: -1;
    }

    .hairline-ring {
      position: absolute;
      border-radius: 50%;
    }

    .ring-outer {
      width: 100%;
      height: 100%;
      border: 1.5px solid rgba(0, 0, 0, 0.04);
      border-left-color: rgba(0, 0, 0, 0.12);
    }

    .ring-middle {
      width: 78%;
      height: 78%;
      border: 1.5px dashed rgba(0, 0, 0, 0.05);
    }

    .ring-inner {
      width: 58%;
      height: 58%;
      border: 1.5px solid rgba(0, 0, 0, 0.03);
      border-top-color: rgba(0, 0, 0, 0.16);
      border-bottom-color: rgba(0, 0, 0, 0.07);
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateRingRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    /* ========================================================
       CÁPSULA DE VIDRIO FROSTED CLARO (APPLE / LUXURY MINIMAL)
       ======================================================== */
    .glass-capsule {
      position: relative;
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 4vw;
      border-radius: clamp(32px, 4vw, 56px);
      padding: 5.5vw 8vw;
      padding: clamp(3.2rem, 5.5vw, 6.5rem) clamp(4.5rem, 8vw, 10rem);
      box-shadow: 
        0 25px 70px rgba(0, 0, 0, 0.06),
        0 8px 24px rgba(0, 0, 0, 0.03),
        0 1px 0 rgba(255, 255, 255, 0.9) inset,
        0 0 0 1px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease;
      cursor: default;
    }

    .glass-capsule:hover {
      border-color: rgba(255, 255, 255, 1);
      box-shadow: 
        0 35px 90px rgba(0, 0, 0, 0.09),
        0 12px 30px rgba(0, 0, 0, 0.04),
        0 1px 0 rgba(255, 255, 255, 1) inset,
        0 0 0 1px rgba(0, 0, 0, 0.06);
    }

    /* ========================================================
       TÍTULO: "Depurando . . ." (SHIMMER GRAFITO OSCURO)
       ======================================================== */
    .title-wrapper {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
    }

    .title {
      font-size: 8.8vw;
      font-size: clamp(4.2rem, 8.8vw, 8.8rem);
      font-weight: 600;
      letter-spacing: -0.035em;
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
    }

    /* Shimmer metálico en grafito profundo y carbón */
    .word {
      display: inline-flex;
      color: #1c1c21;
    }

    @keyframes metallicShimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -140% 0; }
    }

    /* Ondulación muy suave en las letras */
    .char {
      display: inline-block;
    }

    @keyframes charSway {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-4px);
      }
    }

    /* ========================================================
       LOS 3 PUNTOS: ONDA SENOIDAL SUAVE EN GRAFITO Y ONIX
       ======================================================== */
    .dots-group {
      display: inline-flex;
      align-items: center;
      margin-left: 2vw;
      margin-left: clamp(1.2rem, 2vw, 2.8rem);
      position: relative;
      top: -0.08em;
    }

    .fluid-dot {
      width: 1.6vw;
      height: 1.6vw;
      min-width: 14px;
      min-height: 14px;
      max-width: 26px;
      max-height: 26px;
      margin-right: 1.4vw;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #52525b 0%, #27272a 45%, #0e0e11 100%);
      animation: smoothWave 1.65s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      animation-delay: calc(var(--d) * 0.22s);
      will-change: transform, opacity;
    }

    .fluid-dot:last-child { margin-right: 0; }

    .fluid-dot:nth-child(1) { animation-delay: 0s; }
    .fluid-dot:nth-child(2) { animation-delay: 0.22s; }
    .fluid-dot:nth-child(3) { animation-delay: 0.44s; }


    @keyframes smoothWave {
      0%, 100% {
        transform: translateY(0px) scale(0.86);
        opacity: 0.35;
      }
      50% {
        transform: translateY(-14px) scale(1.16);
        opacity: 1;
      }
    }

    /* ========================================================
       OPTIMIZACIONES RESPONSIVE
       ======================================================== */
    @media (max-width: 768px) {
      .glass-capsule {
        padding: 2.2rem 2.8rem;
        border-radius: 24px;
      }
      .title {
        font-size: clamp(2.8rem, 8vw, 4.5rem);
      }
      .dots-group {
        margin-left: 0.8rem;
      }
      .fluid-dot {
        width: 10px;
        height: 10px;
        min-width: 0;
        min-height: 0;
        margin-right: 0.6rem;
      }
    }

    @media (min-width: 1920px) {
      .glass-capsule {
        padding: 5rem 9rem;
      }
      .title {
        font-size: 9rem;
        font-size: clamp(4.2rem, 8.8vw, 11rem);
      }
    }

    /* Sin backdrop-filter (TV): tarjeta más opaca para mantener contraste */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass-capsule { background: rgba(255, 255, 255, 0.92); }
    }

    /* Bicho volando por el fondo (solo transform: ligero para TV) */
    .bug-fly {
      position: absolute;
      top: 0;
      left: 0;
      width: 9vw;
      min-width: 90px;
      max-width: 190px;
      z-index: 5;
      pointer-events: none;
      opacity: 0.55;
      -webkit-animation: bugPath 46s linear infinite;
      animation: bugPath 46s linear infinite;
    }
    .bug-fly img {
      display: block;
      width: 100%;
      height: auto;
      -webkit-animation: bugBob 0.7s ease-in-out infinite alternate;
      animation: bugBob 0.7s ease-in-out infinite alternate;
    }
    @-webkit-keyframes bugBob { from { -webkit-transform: translateY(-7px) rotate(-4deg); } to { -webkit-transform: translateY(7px) rotate(4deg); } }
    @keyframes bugBob { from { transform: translateY(-7px) rotate(-4deg); } to { transform: translateY(7px) rotate(4deg); } }
    @-webkit-keyframes bugPath {
      0%   { -webkit-transform: translate(-15vw, 68vh) scaleX(1); }
      20%  { -webkit-transform: translate(30vw, 14vh) scaleX(1); }
      39%  { -webkit-transform: translate(75vw, 55vh) scaleX(1); }
      49%  { -webkit-transform: translate(108vw, 30vh) scaleX(1); }
      51%  { -webkit-transform: translate(108vw, 30vh) scaleX(-1); }
      70%  { -webkit-transform: translate(55vw, 72vh) scaleX(-1); }
      88%  { -webkit-transform: translate(12vw, 20vh) scaleX(-1); }
      99%  { -webkit-transform: translate(-15vw, 45vh) scaleX(-1); }
      100% { -webkit-transform: translate(-15vw, 68vh) scaleX(1); }
    }
    @keyframes bugPath {
      0%   { transform: translate(-15vw, 68vh) scaleX(1); }
      20%  { transform: translate(30vw, 14vh) scaleX(1); }
      39%  { transform: translate(75vw, 55vh) scaleX(1); }
      49%  { transform: translate(108vw, 30vh) scaleX(1); }
      51%  { transform: translate(108vw, 30vh) scaleX(-1); }
      70%  { transform: translate(55vw, 72vh) scaleX(-1); }
      88%  { transform: translate(12vw, 20vh) scaleX(-1); }
      99%  { transform: translate(-15vw, 45vh) scaleX(-1); }
      100% { transform: translate(-15vw, 68vh) scaleX(1); }
    }

    /* Logo Unison arriba a la derecha */
    .logo-unison {
      position: absolute;
      top: 3vh;
      right: 3vw;
      width: 7vw;
      min-width: 70px;
      max-width: 150px;
      height: auto;
      z-index: 20;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Capas de fondo en modo claro -->
  <div class="bg-gradient"></div>
  <div class="bg-noise-grid"></div>
  <div id="cursor-spotlight"></div>

  <!-- Lienzo interactivo para micropartículas -->
  <canvas id="particle-canvas"></canvas>

  <img class="logo-unison" src="unison.png" alt="Universidad de Sonora">
  <div class="bug-fly"><img src="bicho.png" alt=""></div>

  <!-- Escenario central -->
  <main class="stage">
    
    <!-- Halo ambiental luminoso y anillos hairlines sutiles -->
    <div class="central-glow"></div>
    <div class="rings-container">
      <div class="hairline-ring ring-outer"></div>
      <div class="hairline-ring ring-middle"></div>
      <div class="hairline-ring ring-inner"></div>
    </div>

    <!-- Cápsula de vidrio frosted claro -->
    <div class="glass-capsule" id="card">
      
      <!-- Título: Depurando . . . -->
      <div class="title-wrapper">
        <h1 class="title" aria-label="Depurando . . .">
          <span class="word">
            <span class="char" style="--i:0">D</span>
            <span class="char" style="--i:1">e</span>
            <span class="char" style="--i:2">p</span>
            <span class="char" style="--i:3">u</span>
            <span class="char" style="--i:4">r</span>
            <span class="char" style="--i:5">a</span>
            <span class="char" style="--i:6">n</span>
            <span class="char" style="--i:7">d</span>
            <span class="char" style="--i:8">o</span>
          </span>
          <span class="dots-group" aria-label="...">
            <span class="fluid-dot" style="--d:0"></span>
            <span class="fluid-dot" style="--d:1"></span>
            <span class="fluid-dot" style="--d:2"></span>
          </span>
        </h1>
      </div>

    </div>
  </main>

  <!-- ========================================================
       SCRIPTS: FÍSICA FLUIDA A 60/120 FPS
       ======================================================== -->
  <script>
    (function () {
      var canvas = document.getElementById('particle-canvas');
      var ctx = canvas.getContext('2d');
      var spotlight = document.getElementById('cursor-spotlight');
      var card = document.getElementById('card');

      var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
        function (cb) { return setTimeout(cb, 33); };

      var width = 0;
      var height = 0;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      // Micropartículas en escala de grises suaves
      function DustParticle() { this.reset(true); }
      DustParticle.prototype.reset = function (initial) {
        this.x = Math.random() * width;
        this.y = initial ? Math.random() * height : height + 20;
        this.vx = (Math.random() - 0.5) * 0.35;
        this.vy = -(Math.random() * 0.45 + 0.15);
        this.size = Math.random() * 2.0 + 1.1;
        this.alpha = Math.random() * 0.25 + 0.08;
        this.baseAlpha = this.alpha;
      };
      DustParticle.prototype.update = function (mouse) {
        this.x += this.vx;
        this.y += this.vy;
        if (mouse.x !== null) {
          var dx = this.x - mouse.x;
          var dy = this.y - mouse.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          var maxDist = 180;
          if (dist < maxDist) {
            var force = (1 - dist / maxDist) * 2.5;
            var angle = Math.atan2(dy, dx);
            this.x += Math.cos(angle) * force;
            this.y += Math.sin(angle) * force;
            this.alpha = Math.min(0.55, this.baseAlpha + (1 - dist / maxDist) * 0.35);
          } else {
            this.alpha += (this.baseAlpha - this.alpha) * 0.05;
          }
        }
        if (this.y < -30 || this.x < -30 || this.x > width + 30) {
          this.reset(false);
        }
      };
      DustParticle.prototype.draw = function () {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(70, 75, 85, ' + this.alpha + ')';
        ctx.fill();
      };

      // Ondas concéntricas sutiles al interactuar
      function DropWave(x, y) {
        this.x = x;
        this.y = y;
        this.r = 6;
        this.alpha = 0.35;
      }
      DropWave.prototype.update = function () {
        this.r += 4.2;
        this.alpha *= 0.94;
      };
      DropWave.prototype.draw = function () {
        if (this.alpha <= 0.01) return;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(30, 35, 45, ' + this.alpha + ')';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      };

      // Menos partículas: las TV tienen CPU/GPU modestas
      var particles = [];
      for (var n = 0; n < 18; n++) particles.push(new DustParticle());
      var waves = [];
      var mouse = { x: null, y: null };
      var spotlightX = width / 2;
      var spotlightY = height / 2;
      var tiltX = 0, tiltY = 0, targetTiltX = 0, targetTiltY = 0;

      window.addEventListener('mousemove', function (e) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        spotlight.style.opacity = '1';

        var cx = window.innerWidth / 2;
        var cy = window.innerHeight / 2;
        targetTiltX = -((e.clientY - cy) / cy) * 5;
        targetTiltY = ((e.clientX - cx) / cx) * 5;
      });

      window.addEventListener('mouseout', function (e) {
        if (e.relatedTarget) return;
        mouse.x = null;
        mouse.y = null;
        spotlight.style.opacity = '0';
      });

      window.addEventListener('click', function (e) {
        waves.push(new DropWave(e.clientX, e.clientY));
      });

      // Control remoto (OK/Enter/espacio): onda en el centro de la pantalla
      window.addEventListener('keydown', function (e) {
        var k = e.keyCode;
        if (k === 13 || k === 32) {
          waves.push(new DropWave(window.innerWidth / 2, window.innerHeight / 2));
        }
      });

      function render() {
        if (mouse.x !== null) {
          var spotRadius = spotlight.offsetWidth / 2;
          spotlightX += (mouse.x - spotlightX) * 0.1;
          spotlightY += (mouse.y - spotlightY) * 0.1;
          spotlight.style.webkitTransform = spotlight.style.transform =
            'translate(' + (spotlightX - spotRadius) + 'px, ' + (spotlightY - spotRadius) + 'px)';
        }

        // Parallax de la tarjeta (solo si hay movimiento de puntero)
        if (Math.abs(targetTiltX - tiltX) > 0.01 || Math.abs(targetTiltY - tiltY) > 0.01) {
          tiltX += (targetTiltX - tiltX) * 0.08;
          tiltY += (targetTiltY - tiltY) * 0.08;
          card.style.webkitTransform = card.style.transform =
            'rotateX(' + tiltX.toFixed(2) + 'deg) rotateY(' + tiltY.toFixed(2) + 'deg)';
        }

        ctx.clearRect(0, 0, width, height);

        for (var p = 0; p < particles.length; p++) {
          particles[p].update(mouse);
          particles[p].draw();
        }

        for (var w = waves.length - 1; w >= 0; w--) {
          waves[w].update();
          waves[w].draw();
          if (waves[w].alpha <= 0.01) waves.splice(w, 1);
        }

        raf(render);
      }
      raf(render);
    })();
  </script>
</body>
</html>
